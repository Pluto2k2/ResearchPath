services:
  app:
    build:
      context: .
      target: dev
    # Reaps child processes and forwards SIGTERM/SIGINT to node
    init: true
    # Optional local settings; the file may be absent
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: "3000"
      DB_PATH: ./data/researchpath.db
      NODE_ENV: development
