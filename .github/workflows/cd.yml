name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        # GHCR requires a lowercase repository path
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/researchpath" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy
    needs: publish
    # Deploy only from main, never from a version tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      # Render builds the repo (branch main) itself; the hook only tells it to
      # start. The GHCR image is a versioned artifact.
      - name: Trigger Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping deploy"
            exit 0
          fi
          curl -fsS -X POST --max-time 30 -o /dev/null "$HOOK"
          echo "Render deploy triggered"

      - name: Wait for health check
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping health check"
            exit 0
          fi
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL variable is not set; skipping health check"
            exit 0
          fi
          url="${APP_URL%/}/api/health"
          # Free-plan Render builds from source and may cold start: allow 15 minutes
          deadline=$((SECONDS + 900))
          sleep 30
          while [ "$SECONDS" -lt "$deadline" ]; do
            if body=$(curl -fsS --max-time 10 "$url"); then
              echo "Health check OK: $body"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check did not return 200 within 15 minutes"
          exit 1
